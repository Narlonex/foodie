<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#161613" />
    <title>Foodie</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      * { box-sizing: border-box; }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #161613;
        color: #f3f2eb;
        text-align: center;
        padding: 24px;
      }
      img { width: 96px; height: 96px; margin: 0 auto 20px; }
      h1 { margin: 0 0 8px; font-size: 1.6rem; letter-spacing: -0.03em; }
      p { margin: 0; color: #a8a79d; font-size: 0.9rem; }
      a { display: inline-flex; margin-top: 20px; min-height: 44px; align-items: center; padding: 0 18px; border-radius: 12px; background: #cfdca9; color: #1e1a16; font-weight: 650; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/foodie-mark.png" alt="" width="96" height="96" />
      <h1>Foodie</h1>
      <p>Opening your diary…</p>
      <a href="https://foodie-beige-seven.vercel.app">Open Foodie</a>
    </main>
  </body>
</html>
